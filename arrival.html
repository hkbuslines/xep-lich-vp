<meta charset="UTF-8">
<title>Thông báo đón sân bay</title>
<link rel="stylesheet" href="css/arrival.css">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body class="arrival-body">
  <header class="arrival-header">
    <div class="arrival-title">
      <img src="img/hk-logo.png" alt="HK Buslines" class="hk-logo">
      <span class="plane">🛬</span> Xe đón khách Sân bay Nội Bài
    </div>
    <div class="arrival-clock">
      <div id="clockTime">--:--:--</div>
      <div class="date" id="clockDate">—</div>
    </div>
  </header>

  <div class="filter-bar">
    <span class="filter-label">Chỉ hiện khung giờ</span>
    <input type="time" id="filterFrom">
    <span class="filter-sep">đến</span>
    <input type="time" id="filterTo">
    <button class="filter-clear" id="filterClear">Bỏ lọc</button>
  </div>

  <main class="arrival-board" id="board">
    <p class="arrival-setup" id="setupHint" hidden></p>
    <div class="board-wrap" id="arrivalTable" hidden>
      <div class="board-cell head">Giờ đến SB</div>
      <div class="board-cell head">Tuyến</div>
      <div class="board-cell head">Biển số xe</div>
      <div class="board-cell head">Tài xế</div>
      <div class="board-cell head">Trạng thái</div>
      <div class="board-cell head">Thao tác</div>
    </div>
    <p class="arrival-empty" id="emptyHint" hidden>Hôm nay chưa có chuyến nào trong danh sách đón sân bay.</p>
  </main>

  <footer class="arrival-footer" id="footerStatus">—</footer>

  <div class="delay-modal-overlay" id="delayModal" hidden>
    <div class="delay-modal">
      <h2>Nhập giờ đến sân bay mới</h2>
      <p class="delay-modal-sub" id="delayModalSub"></p>
      <input type="time" id="delayModalInput">
      <div class="delay-modal-actions">
        <button class="btn-ghost" id="delayModalCancel">Huỷ</button>
        <button class="btn-solid" id="delayModalSave">Lưu</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/arrival-app.js"></script>
</body>
