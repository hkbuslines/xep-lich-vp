<meta charset="UTF-8">
<title>Xếp lịch làm việc — Văn phòng</title>
<link rel="stylesheet" href="css/style.css">
<meta name="viewport" content="width=device-width, initial-scale=1">

<header class="topbar">
  <a class="brand" href="index.html">← Trang tổng hợp</a>
  <div class="office-picker">
    <select id="officeSelect"></select>
  </div>
  <div class="sync-badge" id="syncBadge">—</div>
</header>

<main>
  <section class="week-nav">
    <button id="prevWeek" class="btn ghost">‹ Tuần trước</button>
    <div class="week-label" id="weekLabel">—</div>
    <button id="nextWeek" class="btn ghost">Tuần sau ›</button>
    <input id="weekPicker" type="date" title="Chọn ngày bất kỳ trong tuần">
  </section>

  <section class="toolbar">
    <label class="who-label">Tên người xếp lịch:
      <input id="whoInput" type="text" placeholder="VD: Hương">
    </label>
    <button id="regenBtn" class="btn ghost">↻ Tạo lại gợi ý</button>
    <button id="saveBtn" class="btn primary">💾 Lưu lịch tuần</button>
    <button id="exportBtn" class="btn ghost">📥 Xuất Excel</button>
    <span id="statusText" class="status-text"></span>
  </section>

  <section class="timeline-wrap">
    <div id="timeline"></div>
  </section>

  <p class="hint">Bấm vào 1 thanh ca để chọn ca khác (kể cả đổi thành "Nghỉ"). Hoặc kéo-thả 1 thanh ca thả vào ô của người/ngày khác để đổi chỗ 2 ca cho nhau. Thanh mờ ở đầu ngày là phần ca đêm hôm trước vắt sang — muốn đổi thì bấm vào đúng ngày ca đó bắt đầu.</p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/offices-data.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/storage.js"></script>
<script src="js/timeline.js"></script>
<script src="js/export-excel.js"></script>
<script src="js/office-app.js"></script>
