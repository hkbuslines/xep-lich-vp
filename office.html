<meta charset="UTF-8">
<title>Xếp lịch làm việc — Văn phòng</title>
<link rel="stylesheet" href="css/style.css">
<meta name="viewport" content="width=device-width, initial-scale=1">

<header class="topbar">
  <a class="brand" href="index.html">← Trang tổng hợp</a>
  <div class="office-picker">
    <select id="officeSelect"></select>
  </div>
  <div class="sync-badge" id="syncBadge">—</div>
</header>

<main>
  <section class="week-nav">
    <button id="prevWeek" class="btn ghost">‹ Tuần trước</button>
    <div class="week-label" id="weekLabel">—</div>
    <button id="nextWeek" class="btn ghost">Tuần sau ›</button>
    <input id="weekPicker" type="date" title="Chọn ngày bất kỳ trong tuần">
  </section>

  <section class="toolbar">
    <label class="who-label">Tên người xếp lịch:
      <input id="whoInput" type="text" placeholder="VD: Hương">
    </label>
    <button id="regenBtn" class="btn ghost">↻ Tạo lại gợi ý</button>
    <button id="saveBtn" class="btn primary">💾 Lưu lịch tuần</button>
    <span id="statusText" class="status-text"></span>
  </section>

  <section class="legend" id="legend"></section>

  <section class="grid-wrap">
    <table class="schedule-grid" id="scheduleGrid"></table>
  </section>

  <p class="hint">Kéo một ô ca thả vào ô khác (cùng ngày) để đổi ca cho 2 người. Bấm vào ô để chọn ca khác từ danh sách, kể cả "Nghỉ".</p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/offices-data.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/storage.js"></script>
<script src="js/office-app.js"></script>
